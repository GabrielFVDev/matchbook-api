services:
  mysql:
    image: mysql:8.0
    container_name: matchbook-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: matchbook
      MYSQL_USER: matchbook_user
      MYSQL_PASSWORD: matchbook_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-data.sql:/docker-entrypoint-initdb.d/01-init-data.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "matchbook_user", "-pmatchbook_pass" ]
      timeout: 20s
      retries: 10
      interval: 10s
    networks:
      - matchbook-network

  app:
    build: .
    container_name: matchbook-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/matchbook
      SPRING_DATASOURCE_USERNAME: matchbook_user
      SPRING_DATASOURCE_PASSWORD: matchbook_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - matchbook-network
    restart: on-failure

volumes:
  mysql_data:

networks:
  matchbook-network:
    driver: bridge
