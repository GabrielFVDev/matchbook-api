# Cloud profile (Render + Aiven), turned on with SPRING_PROFILES_ACTIVE=cloud.
# Every value comes from an environment variable of the service: no secret lives in this file.
# The variables are listed in the README, section "Deploy no Render + Aiven".
spring.application.name=matchbook

# Render tells the app which port to listen on through PORT.
server.port=${PORT:8080}

# Database. DB_URL looks like jdbc:mysql://<host>:<port>/defaultdb?sslMode=REQUIRED
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Aiven's free plan accepts few connections.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Creates the tables on a brand-new database and keeps them in step with the entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Firebase Auth: only ID tokens issued for this project are accepted
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://securetoken.google.com/${FIREBASE_PROJECT_ID}
spring.security.oauth2.resourceserver.jwt.audiences=${FIREBASE_PROJECT_ID}
